<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration Form</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="stylesheet" href="npm i bootstrap-icons">
</head>

<body>
<div class="one">
    <div class="container">

        <div class="page">
            <div class="circle">
                 <img src="{{ url_for('static', filename='add-user.png') }}" alt="" width="">
            </div>
            <h2 class="head">Student Registration </h2>
            <h2 class="head2">Form</h2>
                
           
        </div>
    </div>
    <div class="box">
        <div class="form">
            <div class="form1">

                <h2>Register Form</h2>

                <form action="/submit" method="post">

                    name : <input type="text" name="name" placeholder="name">
                    <br><br>
                    email: <input type="email" name="email" placeholder="email">
                    <br><br>
                    age : <input type="number" name="age" placeholder="age">
                    <br><br>
                    course: <select name="course">
                        <option value="CS">Computer Science</option>
                        <option value="IT">Information Technology</option>
                        <option value="EC">Electronics and Communication</option>
                    </select>
                    <br><br>

                    <button class="btn" type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
